<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>后台管理 - AI Daily</title>
  <link rel="stylesheet" href="/css/style.css?v=20260428b">
</head>
<body>
<header class="header">
  <div class="header-logo">AI Daily <span>后台管理</span></div>
  <div class="header-actions">
    <button class="btn-icon" id="themeToggle" title="切换主题">🌙</button>
    <a href="/" class="btn-icon" style="display:inline-block">返回首页</a>
  </div>
</header>
<div class="admin-layout">
  <div class="stats-row" id="statsRow">
    <div class="stat-card"><div class="stat-num" id="statTotal">-</div><div class="stat-label">总条数</div></div>
    <div class="stat-card"><div class="stat-num" id="statToday">-</div><div class="stat-label">今日收录</div></div>
  </div>
  <div class="form-card" style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
    <div style="flex:1">
      <strong>自动抓取</strong>
      <p style="font-size:.85rem;color:var(--text-muted);margin-top:4px">抓取最新新闻并自动处理。</p>
    </div>
    <button class="btn btn-success" id="crawlBtn">立即抓取新闻</button>
    <button class="btn btn-primary" id="reprocessBtn">AI 批量补全</button>
  </div>
  <div class="form-card">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
      <strong>抓取历史</strong>
      <button class="btn btn-secondary" onclick="loadCrawlLogs()" style="font-size:.8rem;padding:4px 12px">刷新</button>
    </div>
    <div id="crawlLogs" style="font-size:.85rem;color:var(--text-muted);text-align:center;padding:12px">加载中...</div>
  </div>
  <div class="admin-table-wrap">
    <div class="table-toolbar">
      <h2>新闻列表</h2>
      <input type="text" id="tableSearch" placeholder="搜索..." style="max-width:200px;padding:5px 10px;border-radius:6px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:.85rem">
      <button id="sortBtn" class="btn btn-secondary" style="font-size:.8rem;padding:4px 12px">按重要度排序</button>
      <span id="tableInfo" style="font-size:.82rem;color:var(--text-muted)"></span>
    </div>
    <div style="overflow-x:auto">
      <table>
        <thead><tr><th style="width:40px">ID</th><th>标题</th><th style="width:80px">重要度</th><th style="width:80px">分类</th><th style="width:110px">来源</th><th style="width:130px">时间</th><th style="width:100px">操作</th></tr></thead>
        <tbody id="tableBody"><tr><td colspan="7" style="text-align:center;padding:30px;color:var(--text-muted)">加载中...</td></tr></tbody>
      </table>
    </div>
    <div class="pagination" id="adminPagination" style="padding:12px"></div>
  </div>
</div>
<script src="/js/common.js"></script>
<script src="/js/admin.js"></script>
</body>
</html>
